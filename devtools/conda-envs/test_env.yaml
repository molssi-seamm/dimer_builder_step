name: test

channels:
  - conda-forge

# The CI environment. The package under test is installed on top of it with
# `pip install . --no-deps`, so everything the tests need must be listed here.
# Pure-Python dependencies (the SEAMM packages) come from PyPI, which has a new
# release within minutes; only compiled packages come from conda-forge.
dependencies:
  # Base depends
  - python
  - pip

  # Compiled packages: from conda-forge so the binaries are consistent
  - numpy
  - openbabel
  - rdkit
  - scikit-learn
  - scipy

  # Testing
  - black
  - codecov
  - flake8
  - pytest
  - pytest-cov

  # Documentation
  - pydata-sphinx-theme
  - sphinx-design

  # Pure-Python packages: from PyPI
  - pip:
    - seamm>=2026.9.18.1
    - molsystem>=2026.9.17.2
    - mendeleev
    - plotly
    - seamm_mdi
    # Documentation
    - sphinx-copybutton
    - sphinxnotes-strike
